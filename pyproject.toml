[project]
name = "jb-ape"
version = "0.1.0"
description = "Auto_JB_APE — automated LLM red-team payload wisdom engine (competition red-team research)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "unc1e" }]
dependencies = []

[project.optional-dependencies]
# 运行时（LLM + 浏览器）依赖。测试与静态扫描不强制安装。
runtime = [
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "langchain-core>=0.2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jb_ape"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["ape.py", "mcp_ape.py", "test_ape.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter; we set our own limit
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # tests may use assert False / assert False idioms

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# unittest discovery: src layout 需要把 src 加入路径，此处用项目根的 conftest 兜底
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
